meta:
  graph_id: microwave_base_v1
  base_product: ~20 L, 700 W output, 230 V/50 Hz countertop microwave with mechanical clockwork timer knob (0-30 min, bell at end), 5-step power knob (duty-cycle cam), door push-release button, 20-25 W interior incandescent lamp, glass turntable.
  layers:
  - Field
  - Technology
  - Component
  - Function
  - MarketNeed
  cross_cutting:
  - Product
  - Actor
  - Constraint
  edge_types:
    has_component: Product -> Component
    enabled_by: Component|Function -> Technology
    rooted_in: Technology -> Field
    performs_function: Component -> Function
    enables_function: Function -> Function (derived/secondary function)
    addresses_need: Function -> MarketNeed
    feeds: Component -> Component (energy / signal flow)
    actuates: Component -> Component (mechanical action)
    relevant_to: any -> any (weak association)
    causes: any -> Constraint
    contradicts: Constraint -> any
    partially_mitigates: Component -> Constraint
    resolves: new node -> node it replaces/solves (used by agents)
nodes:
- id: P1
  type: Product
  label: Basic countertop microwave oven (timer knob, power knob, door button, lamp)
- id: D2
  type: Field
  label: Vacuum electronics
- id: D3
  type: Field
  label: Power electronics & electrical engineering
- id: D4
  type: Field
  label: Electromechanics & mechanisms
- id: D6
  type: Field
  label: Materials science (metals, ceramics, glass, polymers)
- id: D9
  type: Field
  label: Manufacturing engineering (stamping, molding, assembly)
- id: D10
  type: Field
  label: Food science (dielectric properties of food)
- id: T3
  type: Technology
  label: Half-wave voltage doubler (capacitor + diode)
  detail: Turns ~2 kV AC from the transformer into ~4 kV pulsating negative DC for the magnetron cathode.
- id: T6
  type: Technology
  label: Quarter-wave choke seal
  detail: λ/4 slot structure in the door rim presents high impedance to leaking RF at the door gap.
- id: T7
  type: Technology
  label: Shaded-pole / synchronous AC micro-motor (electromagnetic induction)
  detail: Low-cost AC motor giving steady low-rpm torque from mains frequency.
- id: T8
  type: Technology
  label: Motor-driven cam timer with spring-return mechanism
  detail: Synchronous motor turns a cam shaft back to zero; cam opens the circuit and trips the bell.
- id: T14
  type: Technology
  label: Dielectric heating (dipolar rotation of water molecules)
  detail: Polar molecules realign with the 2.45 GHz field; friction converts RF energy to heat inside food.
- id: T15
  type: Technology
  label: Tempered / borosilicate glass forming
  detail: Microwave-transparent, thermal-shock-resistant glass for turntable and door window.
- id: T16
  type: Technology
  label: Mica sheet dielectric (muscovite laminate)
  detail: Microwave-transparent, heat-resistant cover that keeps splatter out of the waveguide.
- id: T19
  type: Technology
  label: Mechanical bell striker
  detail: Spring hammer released by the timer cam strikes a metal bell — the classic 'ding'.
- id: T21
  type: Technology
  label: Sintered ferrite permanent magnets
  detail: Ring magnets supplying the axial magnetic field of the magnetron.
- id: T23
  type: Technology
  label: Sheet-steel stamping & spot welding
  detail: Cavity, wrapper, hinges and vent louvres stamped from cold-rolled steel.
- id: T24
  type: Technology
  label: Passive LC EMI line filtering
  detail: X/Y capacitors and choke block conducted RF noise from reaching the mains.
- id: C1
  type: Component
  label: Magnetron tube (2.45 GHz, ~700 W output)
- id: C7
  type: Component
  label: Enamelled steel cooking cavity (~20 L)
- id: C8
  type: Component
  label: Hinged door with perforated metal mesh window
- id: C12
  type: Component
  label: Turntable motor (~5 rpm)
- id: C14
  type: Component
  label: Power-level knob (5-step duty-cycle cam switch)
- id: C16
  type: Component
  label: Door interlock microswitches (primary, secondary, monitor)
- id: C17
  type: Component
  label: Interior lamp (20-25 W incandescent)
- id: C19
  type: Component
  label: Magnetron thermal cutout
- id: C22
  type: Component
  label: End-of-cycle bell (mechanical 'ding')
- id: C25
  type: Component
  label: Mains power cord and plug
- id: C27
  type: Component
  label: Ventilation louvres
- id: F5
  type: Function
  label: Distributes heat evenly by rotating food through the field
- id: F6
  type: Function
  label: Contains microwave radiation inside the appliance
- id: F8
  type: Function
  label: Sets average heating power level
- id: F11
  type: Function
  label: Illuminates cavity so the user can watch the food
- id: F17
  type: Function
  label: Melts / softens butter, chocolate, etc.
- id: F18
  type: Function
  label: Contains spills and allows cleaning
- id: M7
  type: MarketNeed
  label: Safe for family use (radiation, burns, electric shock)
- id: A3
  type: Actor
  label: Student / single-person household
- id: A4
  type: Actor
  label: Elderly user
- id: X3
  type: Constraint
  label: Uneven heating — standing-wave hot and cold spots
- id: X4
  type: Constraint
  label: Metal objects in cavity cause arcing
- id: X7
  type: Constraint
  label: HV capacitor can hold a lethal charge after unplugging
- id: X11
  type: Constraint
  label: Cavity volume limited by countertop size
- id: X12
  type: Constraint
  label: Low BOM target for entry-level price segment
- id: X13
  type: Constraint
  label: No food-state sensing — open-loop cooking
- id: X15
  type: Constraint
  label: Regional mains variants (230 V/50 Hz vs 120 V/60 Hz)
