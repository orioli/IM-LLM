# Final codebook (version 1), edited from codebook_draft.yaml before any new idea was coded.
status: final
version: 1
need: M6
built_from: codebook/old_M6_ideas.csv (250 main-study ideas, blind)
drafted_by: claude-sonnet-5-5 (effort high), 2026-10-19
edited_by: author review of the draft, 2026-10-20
changes_from_draft:
- MV03 widened to food-picture presets on any control (dial or keys); food-picture key ideas O067, O090, O227 move from
  MV13 to MV03 (O091 too).
- MV13 redefined as one control with two or three plain levels; MV35 (single push-dial with light ring) merged into MV13.
- MV25 (container shape selects program) merged into MV19.
- MV02 restricted to weighing; O150 (capacitive load-impedance sensing) moved to MV24, widened to electrical or RF load
  sensing.
- 'Tie-break rules written into the definitions: MV04 vs MV08 vs MV17, MV07 vs MV09, MV01/MV11 vs MV19, MV03 vs MV13
  vs MV22.'
- 'Categories: drawer (MV06), lift-up lid (MV23), sliding door (MV30) and power cradle (MV34) relabelled interaction
  (they change how the user reaches or sets up the oven).'
- 'MV01 and MV11 kept separate: disposable packaging tag (supply chain) vs reusable tagged dish, tile or card.'
- IDs kept stable, so MV25 and MV35 are gaps; 35 moves.
moves:
- id: MV01
  label: Food packaging NFC tag sets program
  replaces: manual setting of time and power
  by: a passive tag printed on the food pack, read by an oven reader (cavity, tray, door or panel)
  definition: The food package carries its own cooking program in a passive tag. The oven reads it when the pack is placed
    or tapped and loads time and power with no user input.
  category: ecosystem
  worked_example_echo: false
  source: old_ideas
  prior_art: unchecked
  prior_art_ref: ''
  examples:
  - O014
  - O019
  - O054
- id: MV02
  label: Weigh food to set time and power
  replaces: timer and power setting
  by: a load cell or strain gauge under the turntable with a mass-to-program lookup
  definition: 'The oven weighs the food on the plate and derives cook time or power from its mass. The user just places
    food and starts. Mass only: sensing the electrical or RF load is MV24.'
  category: technology
  worked_example_echo: false
  source: old_ideas
  prior_art: unchecked
  prior_art_ref: ''
  examples:
  - O037
  - O106
  - O134
- id: MV03
  label: Food-picture preset selector (dial or keys)
  replaces: separate timer and power knobs and numeric settings
  by: one dial, drum, ring or row of keys marked with food pictures, each mapped to a preset time and power
  definition: The user picks a food picture (or tactile food shape) and the oven runs that food's factory preset, so
    the user never sets numbers. Covers mechanical dials and drums as well as membrane, touch or push keys. Plain levels
    without food pictures (Warm/Cook, low/medium/high) are MV13.
  category: interaction
  worked_example_echo: false
  source: old_ideas
  prior_art: unchecked
  prior_art_ref: ''
  examples:
  - O016
  - O021
  - O114
  - O090
  - O067
  - O227
- id: MV04
  label: Door pops open at end of cycle
  replaces: end-of-cook bell and the door-release step
  by: a spring or solenoid that opens the door ajar when the cycle ends
  definition: At cycle end a spring, cam or solenoid cracks the door open by itself. The open door is the 'done' signal
    and gives access to the food with no button. If the user must push or touch the door to open it, code MV08 or MV17
    instead.
  category: interaction
  worked_example_echo: false
  source: old_ideas
  prior_art: unchecked
  prior_art_ref: ''
  examples:
  - O003
  - O024
  - O195
- id: MV05
  label: Colour or light progress and status ring
  replaces: numeric timer readout, bell and interior lamp
  by: LED, light-guide or colour-changing elements that show state by colour or fill
  definition: Cooking progress and completion are shown by colour, fill level or glow, with no numbers or sound. The
    light can be on the rim, handle, plate or window.
  category: interaction
  worked_example_echo: false
  source: old_ideas
  prior_art: unchecked
  prior_art_ref: ''
  examples:
  - O027
  - O093
  - O163
- id: MV06
  label: Pull-out drawer cavity replaces door
  replaces: hinged door and release button
  by: a cavity that slides out on rails with a choke seal
  definition: The cooking chamber is a drawer that slides straight out on runners. Access is a pull and closure a push,
    sometimes starting the cycle, and the sliding joint has an RF choke seal.
  category: interaction
  worked_example_echo: false
  source: old_ideas
  prior_art: unchecked
  prior_art_ref: ''
  examples:
  - O006
  - O045
  - O123
- id: MV07
  label: Steam or humidity sensing auto-stop
  replaces: timer setting
  by: a humidity or gas sensor (or steam-driven bimetal) in the vent that ends cooking when food steams
  definition: A vent sensor or steam-actuated element detects steam, humidity or gas from the food and stops the cycle
    by itself. The user sets no time. If the idea senses food temperature (IR, thermistor, probe), code MV09; if it uses
    both, the primary is the one that ends the cycle and the other is secondary.
  category: technology
  worked_example_echo: false
  source: old_ideas
  prior_art: unchecked
  prior_art_ref: ''
  examples:
  - O039
  - O069
  - O199
- id: MV08
  label: Push anywhere on door to open
  replaces: small door release button and lever
  by: a magnetic or spring push-to-open latch over the whole door face
  definition: 'A magnet or spring catch lets a light push anywhere on the door face release it, so there is no target
    to find. Purely mechanical: if a sensor detects the hand and a motor or solenoid releases the latch, code MV17; if
    the door opens by itself at cycle end, code MV04.'
  category: interaction
  worked_example_echo: false
  source: old_ideas
  prior_art: unchecked
  prior_art_ref: ''
  examples:
  - O002
  - O004
  - O138
- id: MV09
  label: Temperature sensing auto-stop and control
  replaces: timer and power setting
  by: an infrared thermopile or thermistor reading food temperature in closed loop
  definition: A non-contact IR sensor, thermistor or probe reads food temperature or state, and the oven stops or modulates
    heating to reach a target, so the user sets no time or power. Steam or humidity sensing is MV07.
  category: technology
  worked_example_echo: false
  source: old_ideas
  prior_art: unchecked
  prior_art_ref: ''
  examples:
  - O011
  - O055
  - O171
- id: MV10
  label: Close the door to start cooking
  replaces: start button or start step
  by: door-closure sensing that triggers a default or remembered program
  definition: Closing the door on food is the start command, and opening pauses or stops. A default, last-used or learned
    program runs, so there is no start control.
  category: behaviour
  worked_example_echo: false
  source: old_ideas
  prior_art: unchecked
  prior_art_ref: ''
  examples:
  - O013
  - O110
  - O117
- id: MV11
  label: Tagged dish, tile or card sets program
  replaces: manual setting of time and power
  by: a reusable NFC or RFID tag in a plate, tile or card that the oven reads
  definition: A reusable tagged item, such as a plate, bowl, tile or food card, stores the heating program and the oven
    loads it on placement or insertion. The tag belongs to the dish, not to disposable packaging.
  category: ecosystem
  worked_example_echo: false
  source: old_ideas
  prior_art: unchecked
  prior_art_ref: ''
  examples:
