moves:
- id: MV01
  label: Food packaging NFC tag sets program
  replaces: manual setting of time and power
  by: a passive tag printed on the food pack, read by an oven reader (cavity, tray, door or panel)
  definition: The food package carries its own cooking program in a passive tag. The oven reads it when the pack
    is placed or tapped and loads time and power with no user input.
  category: ecosystem
  worked_example_echo: false
  source: old_ideas
  prior_art: unchecked
  prior_art_ref: ''
  examples:
  - O014
  - O019
  - O054
- id: MV02
  label: Weigh food to set time and power
  replaces: timer and power setting
  by: a load cell or strain gauge under the turntable with a mass-to-program lookup
  definition: The oven measures the mass or electrical load of the food on the plate and derives cook time or power
    from it. The user just places food and starts.
  category: technology
  worked_example_echo: false
  source: old_ideas
  prior_art: unchecked
  prior_art_ref: ''
  examples:
  - O037
  - O106
  - O134
- id: MV03
  label: Food-picture rotary dial presets
  replaces: separate timer and power knobs
  by: one knob or drum with food pictograms mapped to preset time and power
  definition: A single rotary dial, drum or ring selects a factory preset by food picture or tactile shape. The
    mapping is by cam or firmware table, so the user never sets numbers.
  category: interaction
  worked_example_echo: false
  source: old_ideas
  prior_art: unchecked
  prior_art_ref: ''
  examples:
  - O016
  - O021
  - O114
- id: MV04
  label: Door pops open at end of cycle
  replaces: end-of-cook bell and the door-release step
  by: a spring or solenoid that opens the door ajar when the cycle ends
  definition: At cycle end a spring, cam or solenoid cracks the door open. The open door is the 'done' signal and
    gives access to the food with no button.
  category: interaction
  worked_example_echo: false
  source: old_ideas
  prior_art: unchecked
  prior_art_ref: ''
  examples:
  - O003
  - O024
  - O195
