# ───────────────────────── TECHNOLOGY ─────────────────────────
- id: T1
  type: Technology
  label: Electron cyclotron motion in crossed E×B fields (cavity magnetron)
  detail: Electrons from a heated cathode spiral under radial E-field + axial B-field, bunching and inducing RF currents in resonant anode cavities.
  proposed_by: agent:seed
  status: retained
- id: T2
  type: Technology
  label: Magnetic-shunt leakage HV transformer
  detail: Step-up transformer with shunts that self-limit current; also supplies ~3 V magnetron filament winding.
  proposed_by: agent:seed
  status: retained
- id: T3
  type: Technology
  label: Half-wave voltage doubler (capacitor + diode)
  detail: Turns ~2 kV AC from the transformer into ~4 kV pulsating negative DC for the magnetron cathode.
  proposed_by: agent:seed
  status: retained
- id: T4
  type: Technology
  label: Rectangular waveguide TE10 mode propagation
  detail: Hollow metal duct sized for 12.2 cm wavelength carries RF from magnetron antenna to the cavity.
  proposed_by: agent:seed
  status: retained
- id: T5
  type: Technology
  label: Sub-wavelength aperture shielding (Faraday cage effect)
  detail: Holes much smaller than 12.2 cm block microwaves while passing visible light.
  proposed_by: agent:seed
  status: retained
- id: T6
  type: Technology
  label: Quarter-wave choke seal
  detail: λ/4 slot structure in the door rim presents high impedance to leaking RF at the door gap.
  proposed_by: agent:seed
  status: retained
- id: T7
  type: Technology
  label: Shaded-pole / synchronous AC micro-motor (electromagnetic induction)
  detail: Low-cost AC motor giving steady low-rpm torque from mains frequency.
  proposed_by: agent:seed
  status: retained
- id: T8
  type: Technology
  label: Motor-driven cam timer with spring-return mechanism
  detail: Synchronous motor turns a cam shaft back to zero; cam opens the circuit and trips the bell.
  proposed_by: agent:seed
  status: retained
- id: T9
  type: Technology
  label: Bimetallic snap-disc thermostat
  detail: Two bonded metals with different thermal expansion snap open a contact at a set temperature.
  proposed_by: agent:seed
  status: retained
- id: T10
  type: Technology
  label: Redundant interlock microswitch logic (primary / secondary / monitor)
  detail: Three switches in series/shunt so that a welded switch blows the fuse instead of leaving RF on.
  proposed_by: agent:seed
  status: retained
- id: T11
  type: Technology
  label: Duty-cycle power modulation (on/off cycling)
  detail: Magnetron runs at full power; average power is set by the on/off ratio over a ~30 s period.
  proposed_by: agent:seed
  status: retained
- id: T12
  type: Technology
  label: Incandescent tungsten-filament lamp
  detail: Heated filament emits visible light; 20-25 W, also a cheap 'cooking in progress' indicator.
  proposed_by: agent:seed
  status: retained
- id: T13
  type: Technology
  label: Forced-air convection cooling
  detail: Axial fan pushes air over magnetron fins and transformer, then vents through the cavity.
  proposed_by: agent:seed
  status: retained
- id: T14
  type: Technology
  label: Dielectric heating (dipolar rotation of water molecules)
  detail: Polar molecules realign with the 2.45 GHz field; friction converts RF energy to heat inside food.
  proposed_by: agent:seed
  status: retained
- id: T15
  type: Technology
  label: Tempered / borosilicate glass forming
  detail: Microwave-transparent, thermal-shock-resistant glass for turntable and door window.
  proposed_by: agent:seed
  status: retained
- id: T16
  type: Technology
  label: Mica sheet dielectric (muscovite laminate)
  detail: Microwave-transparent, heat-resistant cover that keeps splatter out of the waveguide.
  proposed_by: agent:seed
  status: retained
- id: T17
  type: Technology
  label: Enamel / epoxy powder coating of steel
  detail: Reflective conductive steel walls coated for corrosion resistance and easy cleaning.
  proposed_by: agent:seed
  status: retained
- id: T18
  type: Technology
  label: Spring-loaded lever latch mechanics
  detail: Push button drives a lever that lifts door hooks out of the latch and opens the interlocks.
  proposed_by: agent:seed
  status: retained
- id: T19
  type: Technology
  label: Mechanical bell striker
  detail: Spring hammer released by the timer cam strikes a metal bell — the classic 'ding'.
  proposed_by: agent:seed
  status: retained
- id: T20
  type: Technology
  label: Ceramic cartridge fuse (fusible-link overcurrent protection)
  detail: Sand-filled ceramic body fuse rated ~10-15 A, opens on short or interlock monitor action.
  proposed_by: agent:seed
  status: retained
- id: T21
  type: Technology
  label: Sintered ferrite permanent magnets
  detail: Ring magnets supplying the axial magnetic field of the magnetron.
  proposed_by: agent:seed
  status: retained
- id: T22
  type: Technology
  label: Injection-molded engineering thermoplastics (PP, PBT, PPS)
  detail: Knobs, fascia, roller ring and coupler molded in heat-resistant polymers.
  proposed_by: agent:seed
  status: retained
- id: T23
  type: Technology
  label: Sheet-steel stamping & spot welding
  detail: Cavity, wrapper, hinges and vent louvres stamped from cold-rolled steel.
  proposed_by: agent:seed
  status: retained
- id: T24
  type: Technology
  label: Passive LC EMI line filtering
  detail: X/Y capacitors and choke block conducted RF noise from reaching the mains.
  proposed_by: agent:seed
  status: retained

