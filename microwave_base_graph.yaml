# InnoGraph — seed graph G for a BASIC countertop microwave oven
# Layered after Bernegger's innovation matrix:
#   Field  ->  Technology  ->  Component  ->  Function  ->  MarketNeed
# plus cross-cutting Actor and Constraint nodes.
# Base product: the simplest mechanical microwave — interior lamp, one TIME knob,
# one POWER knob, one push-button to open the door. No display, no sensors, no grill.

meta:
  graph_id: microwave_base_v1
  version: 1
  base_product: >-
    ~20 L, 700 W output, 230 V/50 Hz countertop microwave with mechanical clockwork
    timer knob (0-30 min, bell at end), 5-step power knob (duty-cycle cam), door
    push-release button, 20-25 W interior incandescent lamp, glass turntable.
  layers:            # bottom -> top, as in the matrix
    - Field
    - Technology
    - Component
    - Function
    - MarketNeed
  cross_cutting: [Product, Actor, Constraint]
  edge_types:
    has_component:       Product -> Component
    enabled_by:          Component|Function -> Technology
    rooted_in:           Technology -> Field
    performs_function:   Component -> Function
    enables_function:    Function -> Function (derived/secondary function)
    addresses_need:      Function -> MarketNeed
    feeds:               Component -> Component (energy / signal flow)
    actuates:            Component -> Component (mechanical action)
    relevant_to:         any -> any (weak association)
    causes:              any -> Constraint
    contradicts:         Constraint -> any
    partially_mitigates: Component -> Constraint
    resolves:            new node -> node it replaces/solves (used by agents)

